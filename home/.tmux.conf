set -g focus-events on

# Resize panes with vim directions instead of arrow keys. -r makes the binding
# repeatable, so `prefix L L L` widens by 15 without re-pressing the prefix.
#
# resize-pane -L/-R move the pane *boundary*, which inverts for a pane already
# at the edge: -R on the rightmost pane shrinks it. Branch on pane_at_right /
# pane_at_top so H/J/K/L always grow or shrink the focused pane itself.
# (Note: `resize-pane -x +5` is not relative on tmux 3.7 -- it sets width to 5.)
bind -r L run-shell 'tmux resize-pane $([ "#{pane_at_right}" = 1 ] && echo -L || echo -R) 5'
bind -r H run-shell 'tmux resize-pane $([ "#{pane_at_right}" = 1 ] && echo -R || echo -L) 5'
bind -r J run-shell 'tmux resize-pane $([ "#{pane_at_top}" = 1 ] && echo -D || echo -U) 5'
bind -r K run-shell 'tmux resize-pane $([ "#{pane_at_top}" = 1 ] && echo -U || echo -D) 5'

# Pass modified keys (ctrl/shift/alt + arrows, and similar) through to the
# application. tmux-256color's terminfo has no kUP/kDN entries, so without this
# <C-Down> arrives at Neovim indistinguishable from a bare <Down> and window
# resize mappings silently do nothing. extended-keys enables the CSI-u
# encoding; terminal-features tells tmux the outer terminal understands it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
