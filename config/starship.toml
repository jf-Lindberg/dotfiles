add_newline = true

format = """
$directory$git_branch$git_status$golang$java$python$aws$kubernetes$cmd_duration
$character"""

right_format = """$time"""

[directory]
truncation_length = 0
truncate_to_repo = false

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style))"
staged = "[++($count)](green)"
modified = "[!!($count)](yellow)"
untracked = "[??($count)](red)"
deleted = "[✘($count)](red)"
renamed = "[»($count)](blue)"
stashed = "[\\$($count)](cyan)"
conflicted = "[=($count)](red)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[time]
disabled = false
time_format = "%H:%M:%S"
format = "[$time]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[cmd_duration]
min_time = 3000
format = "took [$duration](yellow) "

[golang]
symbol = " "
format = "[$symbol($version)]($style) "

[java]
symbol = " "
format = "[$symbol($version)]($style) "

[python]
symbol = " "
format = "[$symbol($version)]($style) "

[aws]
symbol = "  "
format = "[$symbol($profile)(\\($region\\))]($style) "

[kubernetes]
disabled = false
symbol = "☸ "
format = "[$symbol$context( \\($namespace\\))]($style) "
